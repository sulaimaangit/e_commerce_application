services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgre123
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  product-service:
    build:
      context: ./product-service
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/Products
      DB_USERNAME: postgres
      DB_PASSWORD: postgre123
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/Users
      DB_USERNAME: postgres
      DB_PASSWORD: postgre123
      JWT_SECRET: VGhpcy1pcy1hLWRldi1vbmx5LXVzZXItc2VydmljZS1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcyE=
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
